; §7.2 live path: keeps the alertStream connection open for days.
;
; startsecs=10 is load-bearing (§7's own landmine list): without it, an
; unreachable device causes StreamHikvisionEvents to exit FAILURE
; within ~10s (its own connectTimeout) faster than Supervisor's default
; startsecs, so Supervisor never considers the process to have "started
; successfully" — it counts every attempt as an immediate crash, burns
; through startretries, and gives up permanently rather than backing
; off and retrying indefinitely, which is what an offline device
; actually needs.
;
; command must invoke a PHP 8.3+ binary — the same one used to build
; and test this app. Update the path below to match production's actual
; PHP 8.3+ binary location.
;
; Requires a `devices` row with this exact serial and matching ISAPI
; credentials configured via HIKVISION_USER/HIKVISION_PASS (or a
; per-serial override) in the production .env — never commit real
; values there (§5).
;
; The nightly hikvision-nightly-backfill schedule (routes/console.php)
; is NOT managed by Supervisor — it needs a standard system crontab
; entry running Laravel's own scheduler every minute:
;   * * * * * cd /var/www/app && php8.3 artisan schedule:run >> /dev/null 2>&1
;
; --wait-for-db (docs/setup.md §1/§12) is why this line invokes PHP
; directly rather than wrapping it in a shell: MySQL and Supervisor are
; two independently-enabled boot services with no ordering between them,
; and after an unclean shutdown (no UPS — §1) InnoDB crash recovery can
; take a while, during which mysqld isn't accepting connections yet even
; though its systemd unit already reports "active". The worker polls for
; the database itself before doing anything else, so it waits once,
; visibly, up front instead of crash-looping through startretries and
; flooding this log with connection errors on every boot. Doing it
; in-process also means Supervisor's TERM reaches hikvision:stream
; directly, with no wrapper shell in between to swallow it.
;
; The same worker runs unchanged on Windows under NSSM — see
; deploy/windows/ and docs/setup.md §12.

[program:hikvision-stream]
command=/usr/bin/php8.3 /var/www/app/artisan hikvision:stream main-gate --wait-for-db
directory=/var/www/app
autostart=true
autorestart=true
startretries=999
startsecs=10
stopwaitsecs=15
stopsignal=TERM
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/hikvision-stream.log
stdout_logfile_maxbytes=10MB
