; §7.2 live path: keeps the alertStream connection open for days.
;
; startsecs=10 is load-bearing (§7's own landmine list): without it, an
; unreachable device causes StreamHikvisionEvents to exit FAILURE
; within ~10s (its own connectTimeout) faster than Supervisor's default
; startsecs, so Supervisor never considers the process to have "started
; successfully" — it counts every attempt as an immediate crash, burns
; through startretries, and gives up permanently rather than backing
; off and retrying indefinitely, which is what an offline device
; actually needs.
;
; command must invoke a PHP 8.3+ binary — the same one used to build
; and test this app (see Phase 0 notes: Herd's default `php` here is
; 8.2, `php84` is not). Update the path below to match production's
; actual PHP 8.3+ binary location.
;
; Requires a `devices` row with this exact serial and matching ISAPI
; credentials configured via HIKVISION_USER/HIKVISION_PASS (or a
; per-serial override) in the production .env — never commit real
; values there (§5).
;
; The nightly hikvision-nightly-backfill schedule (routes/console.php)
; is NOT managed by Supervisor — it needs a standard system crontab
; entry running Laravel's own scheduler every minute:
;   * * * * * cd /var/www/app && php84 artisan schedule:run >> /dev/null 2>&1
;
; The command below runs wait-for-mysql.sh first, THEN execs into
; hikvision:stream (docs/setup.md §1/§12) — MySQL and Supervisor are two
; independently-enabled boot services with no ordering between them, and
; after an unclean shutdown (no UPS — §1) InnoDB crash recovery can take
; a while, during which mysqld isn't accepting connections yet even
; though its systemd unit already reports "active". Without this guard
; the stream worker would start against a database that isn't ready and
; rely on autorestart/startretries below to eventually paper over it,
; burning through retries and flooding this log with connection errors
; on every single boot instead of waiting once, visibly, up front.
; `exec` matters: it replaces the wrapper shell with the php84 process
; so SIGTERM from Supervisor still reaches hikvision:stream directly.

[program:hikvision-stream]
command=/bin/bash -c '/var/www/app/deploy/scripts/wait-for-mysql.sh && exec /usr/bin/php84 /var/www/app/artisan hikvision:stream main-gate'
directory=/var/www/app
autostart=true
autorestart=true
startretries=999
startsecs=10
stopwaitsecs=15
stopsignal=TERM
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/hikvision-stream.log
stdout_logfile_maxbytes=10MB
